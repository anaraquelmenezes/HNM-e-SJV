<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hospedagem N.Sra Menina e São José Vitorioso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #F9F5EE;
    --cream-dark: #EDE7D8;
    --gold: #9A7B4F;
    --gold-light: #C4A97D;
    --gold-pale: #F0E6D3;
    --brown: #4A3728;
    --brown-light: #7A5C47;
    --text: #2C2018;
    --text-muted: #7A6B5D;
    --white: #FFFFFF;
    --border: rgba(154,123,79,0.25);
  }

  body {
    font-family: 'Jost', sans-serif;
    background-color: var(--cream);
    color: var(--text);
    line-height: 1.6;
  }

  h1, h2, h3 { font-family: 'Cormorant+Garamond', serif; font-weight: 500; }

  .inner { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

  section { padding: 80px 0; border-bottom: 1px solid var(--border); }

  .section-label { 
    text-transform: uppercase; 
    letter-spacing: 2px; 
    font-size: 13px; 
    color: var(--gold); 
    margin-bottom: 10px; 
    text-align: center;
  }

  .section-title { 
    font-size: 42px; 
    text-align: center; 
    margin-bottom: 50px; 
    color: var(--brown);
  }

  /* Estilos da Seção de Localização */
  .map-container {
    width: 100%;
    height: 450px;
    background: #eee;
    border: 1px solid var(--gold-pale);
    overflow: hidden;
    position: relative;
    border-radius: 4px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    transition: transform 0.3s ease;
  }

  .map-container:hover {
    transform: translateY(-5px);
  }

  .map-container iframe {
    width: 100%;
    height: 100%;
    border: 0;
  }

  .distancias-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 30px;
    margin-top: 40px;
  }

  .distancia-card {
    background: var(--white);
    padding: 30px;
    text-align: center;
    border: 1px solid var(--gold-pale);
  }

  .distancia-nome { font-weight: 500; color: var(--gold); margin-bottom: 5px; }
  .distancia-endereco { font-size: 14px; color: var(--text-muted); }

  /* Adicione aqui outros estilos do seu arquivo original se necessário */

</style>
</head>
<body>

<section id="localizacao">
  <div class="inner">
    <div class="section-label">Como Chegar</div>
    <h2 class="section-title">Localização Privilegiada na Serra da Cantareira</h2>
    
    <a href="https://www.google.com/maps/search/?api=1&query=Serra+da+Cantareira+Mairiporã" target="_blank" style="text-decoration: none; display: block;">
      <div class="map-container">
        <iframe 
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3663.766324831034!2d-46.618683!3d-23.324234!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94cee3f67825b9b1%3A0xc665e8a081548842!2sSerra%20da%20Cantareira!5e0!3m2!1spt-BR!2sbr!4v1715730000000!5m2!1spt-BR!2sbr" 
          allowfullscreen="" 
          loading="lazy" 
          referrerpolicy="no-referrer-when-downgrade">
        </iframe>
      </div>
    </a>

    <div class="distancias-grid">
      <div class="distancia-card">
        <div class="distancia-nome">Acesso Principal</div>
        <div class="distancia-endereco">Estrada da Roseira, Mairiporã - SP</div>
      </div>
      <div class="distancia-card">
        <div class="distancia-nome">Ambiente</div>
        <div class="distancia-endereco">Tranquilidade e Natureza preservada</div>
      </div>
    </div>
  </div>
</section>

</body>
</html>
